name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Prepare
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
      - uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: '5.12.x'
      - uses: gittools/actions/gitversion/execute@v3.2.1
        id: gitversion
      - name: Add NuGet package source
        run: dotnet nuget add source https://nuget.pkg.github.com/${{github.repository_owner}}/index.json --name github --username ${{github.actor}} --password ${{github.token}} --store-password-in-clear-text

      # Build
      - name: Build
        run: src/build.sh ${{steps.gitversion.outputs.nuGetVersion}}${{github.ref_type != 'tag' && format('-{0}', steps.gitversion.outputs.shortSha) || ''}}
      - name: Test
        run: src/test.sh
      - name: Build documentation
        run: doc/build.sh
      - name: Report test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test Report
          reporter: dotnet-trx
          path: src/UnitTests/TestResults/*.trx
      - uses: 0install/github-actions/0template@v1
        id: feed
        with:
          template: typedrest-codegen.xml.template
          version: ${{steps.gitversion.outputs.legacySemVer}}
          github-release: ${{github.ref_type == 'tag'}}

      # Release
      - name: Get tag message
        if: github.ref_type == 'tag'
        id: tag_message
        run: |
          {
            echo "message<<EOF"
            git fetch -f origin tag ${{github.ref_name}}
            git tag -l ${{github.ref_name}} --format="%(contents)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          body: |
            **[NuGet package](https://www.nuget.org/packages/TypedRest.CodeGeneration/${{steps.gitversion.outputs.nuGetVersion}})**
            ## Changes
            ${{steps.tag_message.outputs.message}}
          files: |
            ${{steps.feed.outputs.feed}}
            ${{steps.feed.outputs.archive}}

      # Publish
      - name: Checkout gh-pages
        if: github.ref_type == 'tag'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          show-progress: false
      - uses: 0install/github-actions/0publish@v1
        if: github.ref_type == 'tag'
        with:
          feed: gh-pages/typedrest-codegen.xml
          add-from: ${{steps.feed.outputs.feed}}
          gpg-key: ${{secrets.GPG_KEY}}
      - name: Copy 0install feed into documentation
        if: github.ref_type == 'tag'
        run: cp gh-pages/typedrest-codegen.xml gh-pages/*.gpg artifacts/Documentation/
      - name: Publish documentation
        if: github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{github.token}}
          force_orphan: true
          publish_dir: artifacts/Documentation
          cname: code-generation.typedrest.net
      - name: Publish packages (GitHub)
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'renovate/')
        run: dotnet nuget push artifacts/Release/*.nupkg --source https://nuget.pkg.github.com/${{github.repository_owner}}/index.json --api-key ${{github.token}} --no-symbols --skip-duplicate
      - name: Publish packages (NuGet.org)
        if: github.ref_type == 'tag'
        run: dotnet nuget push artifacts/Release/*.nupkg --source nuget.org --api-key ${{secrets.NUGET_API_KEY}}
